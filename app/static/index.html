<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nginep</title>
<style>
  :root {
    --ink: #0b0b0b; --ink-secondary: #52514e; --ink-muted: #898781;
    --surface: #fcfcfb; --page: #f4f3f0; --border: #e1e0d9;
    --blue: #2a78d6; --blue-dark: #184f95;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .tagline { color: var(--ink-secondary); margin: 0 0 24px; font-size: 0.95rem; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 1rem; background: var(--surface); color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  button {
    padding: 12px 20px; border: none; border-radius: 8px; background: var(--blue);
    color: white; font-size: 1rem; cursor: pointer;
  }
  button:hover { background: var(--blue-dark); }
  button:disabled { background: var(--ink-muted); cursor: default; }
  .hint { color: var(--ink-muted); font-size: 0.85rem; margin-bottom: 24px; }
  .parsed {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 20px; font-size: 0.85rem; color: var(--ink-secondary);
    display: none;
  }
  .parsed b { color: var(--ink); }
  .result {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .result-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .result-name { font-weight: 600; font-size: 1.05rem; }
  .result-area { color: var(--ink-muted); font-size: 0.85rem; }
  .result-meta {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .score { font-variant-numeric: tabular-nums; color: var(--blue-dark); font-weight: 600; }
  .badge {
    display: inline-block; font-size: 0.72rem; color: var(--ink-secondary);
    background: var(--page); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px;
  }
  .badge-maps {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--blue-dark); background: var(--surface); border: 1px solid var(--blue);
    text-decoration: none; cursor: pointer;
  }
  .badge-maps:hover { background: var(--page); }
  .badge-maps svg { width: 11px; height: 11px; flex-shrink: 0; }
  .evidence { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .evidence-stat { display: flex; align-items: center; gap: 7px; font-size: 0.87rem; }
  .evidence-label { font-weight: 600; }
  .evidence-detail { color: var(--ink-muted); }
  .evidence-quote {
    margin: 4px 0 0 15px; padding-left: 10px; border-left: 2px solid var(--border);
    font-size: 0.85rem; color: var(--ink-secondary); font-style: italic; line-height: 1.4;
  }
  .no-evidence { margin-top: 8px; font-size: 0.87rem; color: var(--ink-muted); }
  .empty { color: var(--ink-muted); text-align: center; padding: 32px 0; }
  .also-nearby {
    background: var(--surface); border: 1px dashed var(--border); border-radius: 10px;
    padding: 14px 16px; margin-top: 4px; font-size: 0.85rem;
  }
  .also-nearby-title { color: var(--ink-muted); margin-bottom: 6px; }
  .also-nearby-list { color: var(--ink-secondary); line-height: 1.6; }
  footer { text-align: center; color: var(--ink-muted); font-size: 0.8rem; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="tagline">cari hotel di bali pakai bahasa sehari-hari, dengan bukti dari ulasan asli</p>

  <form id="searchForm">
    <input type="text" id="q" placeholder="hotel tenang di ubud" autocomplete="off">
    <button type="submit" id="submitBtn">cari</button>
  </form>
  <p class="hint">contoh: 'hotel murah di legian' atau 'quiet hotel in sanur'</p>

  <div class="parsed" id="parsed"></div>
  <div id="results"></div>
</div>
<footer>ulasan dari mendeley (cc by 4.0), lokasi dari openstreetmap</footer>

<script>
const form = document.getElementById('searchForm');
const input = document.getElementById('q');
const btn = document.getElementById('submitBtn');
const parsedBox = document.getElementById('parsed');
const resultsBox = document.getElementById('results');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  btn.disabled = true;
  btn.textContent = 'mencari...';
  resultsBox.innerHTML = '';
  parsedBox.style.display = 'none';
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q));
    if (!res.ok) throw new Error('Request failed: ' + res.status);
    const data = await res.json();
    const lang = data.parsed.language === 'en' ? 'en' : 'id';
    renderParsed(data.parsed);
    renderResults(data.results, data.also_nearby || [], lang);
  } catch (err) {
    resultsBox.innerHTML = '<p class="empty">ada masalah saat mencari, coba lagi ya</p>';
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'cari';
  }
});

// Static page chrome (tagline, placeholder, footer) stays Indonesian
// always -- it's fixed before any query exists, so there's nothing to
// match yet. Everything below is about the SEARCH RESULT for one query,
// which does switch to match whatever language that query was asked in
// (detected server-side, see ParsedQuery.language) -- answering an
// English question with Indonesian labels is its own kind of confusing.
const STRINGS = {
  id: {
    youWant: 'yang kamu cari', area: 'area', aspek: 'aspek', konteks: 'konteks',
    match: 'cocok', rating: 'rating', reviews: 'ulasan', of: 'dari',
    viewLocation: 'lihat lokasi',
    noMatch: 'belum nemu yang cocok, coba kata lain ya',
    noEvidence: 'ulasannya belum membahas ini secara spesifik',
    alsoNearby: 'hotel lain di sini, belum sempat dianalisis:',
  },
  en: {
    youWant: 'what you want', area: 'area', aspek: 'aspects', konteks: 'context',
    match: 'match', rating: 'rating', reviews: 'reviews', of: 'of',
    viewLocation: 'view location',
    noMatch: 'no matches found, try different words',
    noEvidence: "reviews haven't covered this specifically",
    alsoNearby: 'other hotels here, not analyzed yet:',
  },
};

const ASPECT_LABELS = {
  id: {
    ac: 'AC', air_panas: 'air panas', bau: 'bau kamar', general: 'kesan umum',
    kebersihan: 'kebersihan', linen: 'sprei & handuk', service: 'pelayanan',
    sunrise_meal: 'sarapan', tv: 'TV', wifi: 'wifi', value: 'harga',
    accessibility: 'lokasi & akses', sleep_quality: 'ketenangan',
  },
  en: {
    ac: 'AC', air_panas: 'hot water', bau: 'room smell', general: 'overall',
    kebersihan: 'cleanliness', linen: 'linen', service: 'service',
    sunrise_meal: 'breakfast', tv: 'TV', wifi: 'wifi', value: 'value',
    accessibility: 'location', sleep_quality: 'quietness',
  },
};

function renderParsed(p) {
  const lang = p.language === 'en' ? 'en' : 'id';
  const t = STRINGS[lang];
  document.documentElement.lang = lang;
  const bits = [];
  if (p.area) bits.push(`<b>${t.area}:</b> ${escapeHtml(p.area)}`);
  if (p.aspects_wanted && p.aspects_wanted.length) {
    const labels = p.aspects_wanted.map(a => ASPECT_LABELS[lang][a] || a);
    bits.push(`<b>${t.aspek}:</b> ${escapeHtml(labels.join(', '))}`);
  }
  if (p.purpose) bits.push(`<b>${t.konteks}:</b> ${escapeHtml(p.purpose)}`);
  if (!bits.length) { parsedBox.style.display = 'none'; return; }
  parsedBox.innerHTML = `${t.youWant}: ` + bits.join(', ');
  parsedBox.style.display = 'block';
}

function renderResults(results, alsoNearby, lang) {
  const t = STRINGS[lang];
  if (!results.length && !alsoNearby.length) {
    resultsBox.innerHTML = `<p class="empty">${t.noMatch}</p>`;
    return;
  }
  resultsBox.innerHTML = results.map(r => `
    <div class="result">
      <div class="result-head">
        <span class="result-name">${escapeHtml(r.name)}</span>
        <span class="result-area">${escapeHtml(r.area || '')}</span>
      </div>
      <div class="result-meta">
        <span><span class="score">${(r.score * 100).toFixed(0)}%</span> ${t.match}</span>
        ${r.avg_rating ? `<span class="badge">${t.rating} ${r.avg_rating}/5</span>` : ''}
        ${r.review_count ? `<span class="badge">${r.review_count} ${t.reviews}</span>` : ''}
        ${mapsLink(r.lat, r.lon, lang)}
      </div>
      ${renderEvidence(r.evidence, lang)}
    </div>
  `).join('') + renderAlsoNearby(alsoNearby, lang);
}

function renderEvidence(evidence, lang) {
  const t = STRINGS[lang];
  if (!evidence || !evidence.length) {
    return `<div class="no-evidence">${t.noEvidence}</div>`;
  }
  return '<div class="evidence">' + evidence.map(ev => `
    <div>
      <div class="evidence-stat">
        <span class="evidence-label">${escapeHtml(ASPECT_LABELS[lang][ev.aspect] || ev.aspect)}</span>
        <span class="evidence-detail">${ev.pct}% (${ev.pos} ${t.of} ${ev.mentioned} ${t.reviews})</span>
      </div>
      ${ev.quote ? `<div class="evidence-quote">'${escapeHtml(ev.quote)}'</div>` : ''}
    </div>
  `).join('') + '</div>';
}

function renderAlsoNearby(hotels, lang) {
  if (!hotels.length) return '';
  const t = STRINGS[lang];
  const names = hotels.map(h => escapeHtml(h.name)).join(', ');
  return `
    <div class="also-nearby">
      <div class="also-nearby-title">${t.alsoNearby}</div>
      <div class="also-nearby-list">${names}</div>
    </div>
  `;
}

const PIN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

function mapsLink(lat, lon, lang) {
  if (lat == null || lon == null) return '';
  const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
  return `<a class="badge badge-maps" href="${url}" target="_blank" rel="noopener">${PIN_SVG} ${STRINGS[lang].viewLocation}</a>`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}
</script>
</body>
</html>

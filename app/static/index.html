<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TanyaInap</title>
<style>
  :root {
    --ink: #0b0b0b; --ink-secondary: #52514e; --ink-muted: #898781;
    --surface: #fcfcfb; --page: #f4f3f0; --border: #e1e0d9;
    --blue: #2a78d6; --blue-dark: #184f95;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  /* bold system-ui renders capital I almost identical to lowercase l --
     "TanyaInap" reads as "Tanyalnap" at a glance without this */
  .brand-i { color: var(--blue); }
  .tagline { color: var(--ink-secondary); margin: 0 0 24px; font-size: 0.95rem; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 1rem; background: var(--surface); color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  button {
    padding: 12px 20px; border: none; border-radius: 8px; background: var(--blue);
    color: white; font-size: 1rem; cursor: pointer;
  }
  button:hover { background: var(--blue-dark); }
  button:disabled { background: var(--ink-muted); cursor: default; }
  .hint { color: var(--ink-muted); font-size: 0.85rem; margin-bottom: 24px; }
  .parsed {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 20px; font-size: 0.85rem; color: var(--ink-secondary);
    display: none;
  }
  .parsed b { color: var(--ink); }
  .result {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .result-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .result-name { font-weight: 600; font-size: 1.05rem; }
  .result-area { color: var(--ink-muted); font-size: 0.85rem; }
  .score { font-variant-numeric: tabular-nums; color: var(--blue-dark); font-weight: 600; }
  .badge {
    display: inline-block; font-size: 0.72rem; color: var(--ink-secondary);
    background: var(--page); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 8px; margin-left: 8px;
  }
  .explanation { margin-top: 8px; font-size: 0.9rem; color: var(--ink-secondary); line-height: 1.5; }
  .empty { color: var(--ink-muted); text-align: center; padding: 32px 0; }
  footer { text-align: center; color: var(--ink-muted); font-size: 0.8rem; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tanya<span class="brand-i">I</span>nap</h1>
  <p class="tagline">Cari hotel di Bali pakai bahasa sehari-hari, lengkap dengan bukti dari ulasan asli.</p>

  <form id="searchForm">
    <input type="text" id="q" placeholder="hotel tenang di Ubud, wifi kencang, sarapan enak" autocomplete="off">
    <button type="submit" id="submitBtn">Cari</button>
  </form>
  <p class="hint">Contoh: "hotel di Legian, servicenya ramah" &middot; "quiet hotel in Sanur with good breakfast"</p>

  <div class="parsed" id="parsed"></div>
  <div id="results"></div>
</div>
<footer>Data ulasan: Mendeley Bali Hotel Reviews (CC BY 4.0) &middot; lokasi: OpenStreetMap</footer>

<script>
const form = document.getElementById('searchForm');
const input = document.getElementById('q');
const btn = document.getElementById('submitBtn');
const parsedBox = document.getElementById('parsed');
const resultsBox = document.getElementById('results');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  btn.disabled = true;
  btn.textContent = 'Mencari...';
  resultsBox.innerHTML = '';
  parsedBox.style.display = 'none';
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q));
    if (!res.ok) throw new Error('Request failed: ' + res.status);
    const data = await res.json();
    renderParsed(data.parsed);
    renderResults(data.results);
  } catch (err) {
    resultsBox.innerHTML = '<p class="empty">Ada masalah saat mencari, coba lagi ya.</p>';
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Cari';
  }
});

const ASPECT_LABELS_ID = {
  ac: 'AC', air_panas: 'air panas', bau: 'aroma kamar', general: 'kesan umum',
  kebersihan: 'kebersihan', linen: 'sprei & handuk', service: 'pelayanan',
  sunrise_meal: 'sarapan', tv: 'TV', wifi: 'wifi', value: 'harga',
  accessibility: 'lokasi & akses', sleep_quality: 'ketenangan',
};

function renderParsed(p) {
  const bits = [];
  if (p.area) bits.push(`<b>area:</b> ${escapeHtml(p.area)}`);
  if (p.aspects_wanted && p.aspects_wanted.length) {
    const labels = p.aspects_wanted.map(a => ASPECT_LABELS_ID[a] || a);
    bits.push(`<b>aspek:</b> ${escapeHtml(labels.join(', '))}`);
  }
  if (p.purpose) bits.push(`<b>konteks:</b> ${escapeHtml(p.purpose)}`);
  if (p.price_max_idr) bits.push(`<b>maks harga:</b> Rp${p.price_max_idr.toLocaleString('id-ID')} (harga belum tersedia di data ini)`);
  if (!bits.length) { parsedBox.style.display = 'none'; return; }
  parsedBox.innerHTML = 'Dipahami sebagai: ' + bits.join(' &middot; ');
  parsedBox.style.display = 'block';
}

function renderResults(results) {
  if (!results.length) {
    resultsBox.innerHTML = '<p class="empty">Belum ada hotel yang cocok.</p>';
    return;
  }
  resultsBox.innerHTML = results.map(r => `
    <div class="result">
      <div class="result-head">
        <span class="result-name">${escapeHtml(r.name)}</span>
        <span class="result-area">${escapeHtml(r.area || '')}</span>
      </div>
      <div>
        ${r.has_reviews ? `<span class="score">${(r.score * 100).toFixed(0)}%</span> cocok` : ''}
        ${!r.has_reviews ? '<span class="badge">belum ada ulasan</span>' : ''}
        ${r.avg_rating ? `<span class="badge">rating ${r.avg_rating}/5</span>` : ''}
        ${r.review_count ? `<span class="badge">${r.review_count} ulasan</span>` : ''}
      </div>
      <div class="explanation">${escapeHtml(r.explanation)}</div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}
</script>
</body>
</html>
